name: Publish Docker

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  publish-docker:
    name: publish-docker
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Install .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        global-json-file: "./global.json"

    - name: Set up Docker
      uses: docker/setup-docker-action@v5
      with:
        daemon-config: |
          {
            "debug": true,
            "features": {
              "containerd-snapshotter": true
            }
          }

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build SDK container image
      run: |
        dotnet publish src/Meetup.McpServer/Meetup.McpServer.csproj \
          /t:PublishContainer \
          -c Release \
          -p:ContainerImageTags=sdk-base \
          -p:VersionPrefix=${{ github.ref_name }}

    - name: Build final image with volume fix
      run: |
        docker build \
          --build-arg BASE_IMAGE=aaronontheweb/meetup-mcp:sdk-base \
          -t aaronontheweb/meetup-mcp:${{ github.ref_name }} \
          -t aaronontheweb/meetup-mcp:latest \
          -f src/Meetup.McpServer/Dockerfile .

    - name: Push images
      run: |
        docker push aaronontheweb/meetup-mcp:${{ github.ref_name }}
        docker push aaronontheweb/meetup-mcp:latest

    - name: Update Docker Hub description
      uses: peter-evans/dockerhub-description@v5
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        repository: aaronontheweb/meetup-mcp
        readme-filepath: ./README.md
