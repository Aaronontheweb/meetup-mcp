name: Create Release

on:
  push:
    tags:
      - '*'

permissions:
   contents: write

jobs:
  create-release:
    name: create-release
    runs-on: ubuntu-latest

    steps:
    - name: "Checkout"
      uses: actions/checkout@v6.0.2
      with:
        lfs: true
        fetch-depth: 0

    - name: "Extract latest release notes"
      shell: pwsh
      run: |
        $content = Get-Content RELEASE_NOTES.md -Raw
        if ($content -match '(?s)(####.+?)(?=\n####|\z)') {
          $Matches[1].Trim() | Set-Content RELEASE_NOTES_LATEST.md
        } else {
          $content | Set-Content RELEASE_NOTES_LATEST.md
        }

    - name: release
      uses: actions/create-release@v1
      id: create_release
      with:
        draft: false
        prerelease: false
        release_name: 'meetup-mcp ${{ github.ref_name }}'
        tag_name: ${{ github.ref }}
        body_path: RELEASE_NOTES_LATEST.md
      env:
        GITHUB_TOKEN: ${{ github.token }}
