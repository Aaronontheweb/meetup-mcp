services:
  meetup-mcp:
    image: aaronontheweb/meetup-mcp:latest
    container_name: meetup-mcp
    restart: unless-stopped
    network_mode: host
    environment:
      - ASPNETCORE_URLS=http://+:5180
    env_file:
      - .env
    volumes:
      - meetup-mcp-tokens:/home/app/.meetup-mcp

volumes:
  meetup-mcp-tokens:
